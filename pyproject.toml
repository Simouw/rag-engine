[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-engine"
version = "0.1.0"
description = "A self-hosted, bring-your-own-keys RAG engine with hybrid retrieval and source-grounded answers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "rag-engine contributors" }]
keywords = ["rag", "retrieval", "fastapi", "pgvector", "llm", "embeddings"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Framework :: FastAPI",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "aiosqlite>=0.20",
  "asyncpg>=0.30",
  "pgvector>=0.3.6",
  "openai>=1.68,<2",
  "pydantic-settings>=2.9,<3",
  "pymupdf>=1.25,<2",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
]

[project.optional-dependencies]
local = ["fastembed>=0.4,<0.8"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "httpx>=0.28",
  "ruff>=0.11",
]

[project.scripts]
rag-engine = "rag_engine.cli:main"

[tool.setuptools.packages.find]
include = ["rag_engine*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
